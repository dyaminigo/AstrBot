name: Build Custom AstrBot Image

on:
  push:
    tags:
      - "v*.*.*-custom.*"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: custom-docker-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/astrbot

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout custom branch on manual run
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch origin custom
          git checkout -B custom origin/custom

      - name: Build Dashboard
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            dashboard_version="${GITHUB_REF_NAME}"
          else
            short_sha=$(git rev-parse --short=12 HEAD)
            dashboard_version="custom-${short_sha}"
          fi

          cd dashboard
          npm install
          npm run build
          mkdir -p dist/assets
          echo "$dashboard_version" > dist/assets/version

          cd ..
          mkdir -p astrbot/dashboard
          rm -rf astrbot/dashboard/dist
          cp -r dashboard/dist astrbot/dashboard/dist

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: meta
        shell: bash
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME}"
          SHORT_SHA=$(git rev-parse --short=12 HEAD)

          {
            echo "tags<<EOF"
            echo "${IMAGE}:latest"
            echo "${IMAGE}:sha-${SHORT_SHA}"

            if [ "${{ github.event_name }}" = "push" ]; then
              echo "${IMAGE}:${GITHUB_REF_NAME}"
            fi

            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
